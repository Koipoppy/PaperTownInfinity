<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pop-up Atlas</title>
    <meta name="description" content="An endless handmade pop-up book you can walk through." />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b120c; }
      canvas#atlas {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; touch-action: none; outline: none; cursor: none;
      }
      #hint {
        position: fixed; left: 0; right: 0; bottom: 4.5vh; text-align: center;
        font: 500 13px/1.6 Georgia, 'Times New Roman', serif; letter-spacing: 0.14em;
        color: rgba(255, 240, 214, 0.78); text-shadow: 0 1px 6px rgba(20, 10, 0, 0.55);
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 1.2s ease;
      }
      #hint.on { opacity: 1; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #1b120c; color: #e8d5ad; z-index: 10;
        font: 500 12px/1.6 Georgia, 'Times New Roman', serif; letter-spacing: 0.22em;
        transition: opacity 0.8s ease; pointer-events: none;
      }
      #boot.done { opacity: 0; }
    </style>
  </head>
  <body>
    <canvas id="atlas" tabindex="0"></canvas>
    <div id="hint">WASD / 点击行走 &nbsp;·&nbsp; Shift 快走 &nbsp;·&nbsp; N 昼夜 &nbsp;·&nbsp; M 静音</div>
    <div id="boot">正在打开立体书…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
